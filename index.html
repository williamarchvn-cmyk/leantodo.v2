<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ECEEF3">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090A0D">
<meta name="application-name" content="Lean to do">
<meta name="apple-mobile-web-app-title" content="Lean to do">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lean to do</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232C44BC'/%3E%3Crect x='13' y='15' width='38' height='9' rx='3' fill='%23fff'/%3E%3Crect x='13' y='28' width='38' height='9' rx='3' fill='%23fff' opacity='.62'/%3E%3Crect x='13' y='41' width='38' height='9' rx='3' fill='%23fff' opacity='.32'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#ECEEF3;--panel:#F8F9FB;--solid:#FFFFFF;--field:#EDEFF3;
  --ink:#151826;--muted:#8A90A2;--line:rgba(21,24,38,.07);
  --btn:#151826;--btn-fg:#FFFFFF;--danger:#E5484D;
  --z1:#2C42B4;--z1t:#F0F1F9;
  --z3:#0E7A6C;--z3t:#ECF5F3;
  --z4:#C55F17;--z4t:#FAF1EA;
  --fade:#FFFFFF;
  --rh:44px;
  --run:#2C44BC;--run-far:#9AA8E6;--run-acc:#E06A12;
  --ease:cubic-bezier(.2,.8,.2,1);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#090A0D;--panel:#121419;--solid:#181B22;--field:#1D2028;
  --ink:#ECEEF4;--muted:#7D8396;--line:rgba(255,255,255,.06);
  --btn:#ECEEF4;--btn-fg:#0B0C10;
  --z1:#4862DC;--z1t:#10121C;
  --z3:#128475;--z3t:#0D1615;
  --z4:#CC6519;--z4t:#17110C;
  --fade:#1E222B;
  --run:#7489F4;--run-far:#3A4590;--run-acc:#F08A3A;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit;margin:0}
button{cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}

/* ---------- layout ---------- */
.app{position:fixed;inset:0;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,44fr) auto minmax(0,56fr);gap:8px;
  padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 8px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 8px)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;min-height:0}

/* ---------- brand ---------- */
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:2px 0 0 7px}
.runner{flex:none;display:block;margin:0 auto;transform:translateX(-38%);width:clamp(96px,29vw,128px);height:auto;aspect-ratio:120/56;overflow:visible;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 40%);mask-image:linear-gradient(90deg,transparent 0,#000 40%)}
.runner *{stroke:none}
.runner g{transform-box:view-box}
.runner line{stroke-width:5.2;stroke-linecap:round}
.r-near line{stroke:var(--run)}
.r-far line{stroke:var(--run-far)}
.r-head{fill:var(--run)}
.r-body{animation:r-bob .33s ease-in-out infinite}
.r-leg{transform-origin:88px 30px;animation:r-thigh .66s linear infinite}
.r-shin{transform-origin:88px 41px;animation:r-shin .66s linear infinite}
.r-arm{transform-origin:93px 16px;animation:r-arm .66s ease-in-out infinite}
.r-fore{transform-origin:93px 25px;animation:r-fore .66s ease-in-out infinite}
.r-far .r-leg,.r-far .r-shin,.r-far .r-arm,.r-far .r-fore{animation-delay:-.33s}
.r-ground{stroke:var(--muted)!important;stroke-width:1.4!important;stroke-linecap:round;stroke-dasharray:9 5;opacity:.5;animation:r-ground .32s linear infinite}
.r-shadow{fill:var(--ink);opacity:.1;transform-box:fill-box!important;transform-origin:center;animation:r-shadow .33s ease-in-out infinite}
.r-sp{stroke:var(--run-acc)!important;stroke-width:2.6!important;opacity:0;animation:r-speed .66s linear infinite}
.r-sp:nth-child(2){animation-delay:-.22s}
.r-sp:nth-child(3){animation-delay:-.44s}
@keyframes r-thigh{0%,100%{transform:rotate(-35deg)}20%{transform:rotate(0deg)}40%{transform:rotate(35deg)}55%{transform:rotate(20deg)}75%{transform:rotate(-55deg)}90%{transform:rotate(-50deg)}}
@keyframes r-shin{0%,100%{transform:rotate(15deg)}20%{transform:rotate(25deg)}40%{transform:rotate(15deg)}55%{transform:rotate(100deg)}75%{transform:rotate(75deg)}90%{transform:rotate(40deg)}}
@keyframes r-arm{0%,100%{transform:rotate(52deg)}50%{transform:rotate(-55deg)}}
@keyframes r-fore{0%,100%{transform:rotate(-64deg)}50%{transform:rotate(-95deg)}}
@keyframes r-bob{0%,100%{transform:translateY(0)}40%{transform:translateY(1.6px)}90%{transform:translateY(-1.5px)}}
@keyframes r-shadow{0%,100%{transform:scaleX(1);opacity:.1}40%{transform:scaleX(1.12);opacity:.14}90%{transform:scaleX(.84);opacity:.07}}
@keyframes r-ground{to{stroke-dashoffset:28}}
@keyframes r-speed{0%{transform:translateX(10px);opacity:0}25%{opacity:.85}100%{transform:translateX(-16px);opacity:0}}
.brand-in{width:clamp(116px,35vw,152px);display:flex;flex-direction:column;gap:4px}
.logo{display:block;width:100%;height:auto;-webkit-user-drag:none;user-select:none;pointer-events:none}
.by{display:block;width:100%;height:auto;overflow:visible}
.by text{font-family:var(--font);font-size:20px;font-weight:500;fill:var(--muted);stroke:none;opacity:.6}
@media (prefers-color-scheme:dark){.logo{filter:brightness(1.3) saturate(1.08)}.by text{opacity:.5}}

/* ---------- zones ---------- */
.zone{--acc:var(--z1);--tint:var(--z1t);position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;border-radius:20px;background:var(--tint);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s}
#z3{--acc:var(--z3);--tint:var(--z3t)}
#z4{--acc:var(--z4);--tint:var(--z4t)}
.zone.over{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--acc) 50%,transparent)}
.zone.deny{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--danger) 75%,transparent)}
.zh{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;height:30px;padding:4px 13px 0}
.zl{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);white-space:nowrap}
.zl::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.zc{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.zc.full{color:var(--acc)}
.list{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:2px 7px 8px;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.list.ft{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 16px);mask-image:linear-gradient(to bottom,transparent,#000 16px)}
.list.fb{-webkit-mask-image:linear-gradient(to top,transparent,#000 20px);mask-image:linear-gradient(to top,transparent,#000 20px)}
.list.ft.fb{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 16px,#000 calc(100% - 20px),transparent);mask-image:linear-gradient(to bottom,transparent,#000 16px,#000 calc(100% - 20px),transparent)}

/* ---------- cards ---------- */
.card{position:relative;flex:none;border-radius:13px;padding:10px 11px 10px 12px;min-height:50px;
  background-color:var(--bg,#888);background-image:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,0) 55%);
  color:var(--fg,#fff);box-shadow:var(--sh,none);cursor:grab;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;
  transition:background-color .3s,color .3s,box-shadow .3s,scale .18s}
.card.press{scale:.975}
.card *{pointer-events:none}
.ct{font-size:14px;font-weight:600;line-height:1.3;letter-spacing:-.005em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cm{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:6px;font-size:11.5px;font-weight:500;line-height:1.2;opacity:.84}
.cm:empty{display:none}
.cm>span{display:inline-flex;align-items:center;gap:4px;min-width:0;max-width:100%}
.cm i{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm svg{width:12px;height:12px;stroke-width:2.2}
.cm .cj{align-items:flex-start}
.cm .cj svg{margin-top:1px}
.cm .cj i{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.cd.late::after{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:#FF5A5F;box-shadow:0 0 0 1.5px var(--bg)}
.card.row{display:flex;align-items:center;gap:10px;height:var(--rh);min-height:0;padding:0 12px}
.card.row .ct{flex:1;min-width:0;display:block;font-size:14.5px;white-space:nowrap;text-overflow:ellipsis}
.card.row .cm{flex:0 1 auto;max-width:55%;margin:0;flex-wrap:nowrap;justify-content:flex-end;gap:10px}
.card.ph{background:transparent!important;box-shadow:none!important;outline:1.5px dashed var(--phc);outline-offset:-1.5px;scale:1}
.card.ph>*{visibility:hidden}
.ghost{position:fixed!important;left:0;top:0;margin:0;z-index:50;pointer-events:none;will-change:transform;cursor:grabbing;
  transition:background-color .25s,color .25s,width .18s var(--ease);
  box-shadow:0 24px 44px -16px rgba(10,12,28,.5),0 8px 16px -8px rgba(10,12,28,.3),inset 0 1px 0 rgba(255,255,255,.18)!important}
.ghost.settle{box-shadow:var(--sh)!important}
.ghost.doomed{background-color:var(--danger)!important;background-image:none;color:#fff!important}
.ghost.doomed .cd.late::after{box-shadow:none}

/* ---------- composer ---------- */
.composer{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px;grid-template-rows:44px 40px;gap:6px;padding:7px;border-radius:20px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.in,.field{border-radius:13px;background:var(--field);transition:background-color .2s,box-shadow .2s}
.in{grid-column:1/3;width:100%;min-width:0;border:0;outline:0;padding:0 14px;font-size:16px;font-weight:500;color:var(--ink)}
.in:focus,.field:focus-within{background:var(--solid);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ink) 18%,transparent)}
.add{grid-column:3;grid-row:1;display:grid;place-items:center;padding:0;border:0;border-radius:13px;background:var(--btn);color:var(--btn-fg);transition:opacity .2s,transform .15s}
.add svg{width:20px;height:20px;stroke-width:2.4}
.add.off{opacity:.28}
.add:active{transform:scale(.92)}
.field{position:relative;display:flex;align-items:center;gap:8px;min-width:0;padding:0 8px 0 11px;color:var(--muted)}
.field>svg{width:16px;height:16px}
.composer .person{grid-column:1;grid-row:2}
.composer .time{grid-column:2/4;grid-row:2}
.field input[type=text]{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:16px;font-weight:500;color:var(--ink);padding:0}
.tv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:500}
.field.has .tv{color:var(--ink)}
.field.late .tv{color:var(--danger)}
.field input[type=datetime-local]{position:absolute;inset:0;width:100%;height:100%;opacity:0;z-index:1;border:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.clr{position:relative;z-index:2;display:none;place-items:center;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--muted)}
.clr svg{width:13px;height:13px;stroke-width:2.4}
.field.has .clr{display:grid}

/* ---------- edit sheet ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(8,10,20,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{--acc:var(--z1);position:fixed;z-index:61;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 9dvh);max-width:480px;margin:0 auto;padding:14px;border-radius:24px;background:var(--solid);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 30px 70px -24px rgba(0,0,0,.55);opacity:0;transform:translateY(10px) scale(.97);pointer-events:none;transition:opacity .18s,transform .3s cubic-bezier(.2,.9,.25,1.12)}
.sheet.on{opacity:1;transform:none;pointer-events:auto}
.stag{display:inline-flex;align-items:center;gap:6px;padding:2px 2px 8px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--acc)}
.stag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
#eTitle{display:block;width:100%;min-height:40px;padding:2px 2px 12px;border:0;outline:0;resize:none;background:transparent;font-size:19px;font-weight:600;line-height:1.35;color:var(--ink)}
.srow{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:8px;height:44px}
.sact{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.btn{height:42px;padding:0 18px;border:0;border-radius:13px;font-size:15px;font-weight:600}
.btn.lite{background:transparent;color:var(--muted)}
.btn.solid{min-width:96px;background:var(--acc);color:#fff}
.btn:active{transform:scale(.96)}

/* ---------- feedback ---------- */
.edge{position:fixed;inset:0;z-index:45;pointer-events:none;opacity:0;transition:opacity .2s;box-shadow:inset 0 0 0 2px rgba(229,72,77,.6),inset 0 0 80px rgba(229,72,77,.3)}
.edge.on{opacity:1}
.snack{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:70;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:8px 8px 8px 16px;border-radius:16px;
  background:#15171F;color:#fff;font-size:14px;font-weight:500;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);opacity:0;transform:translate(-50%,16px);pointer-events:none;transition:opacity .22s,transform .3s var(--ease)}
.snack.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.snack span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snack button{flex:none;height:34px;padding:0 13px;border:0;border-radius:10px;background:rgba(255,255,255,.13);color:#fff;font-size:13.5px;font-weight:600}
@media (prefers-color-scheme:dark){.snack{background:#E9EBF1;color:#121420}.snack button{background:rgba(0,0,0,.08);color:#121420}}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}

@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}
@keyframes flash{0%{scale:1}35%{scale:1.035}100%{scale:1}}
@keyframes shake{0%,100%{translate:0}20%{translate:-4px 0}40%{translate:4px 0}60%{translate:-3px 0}80%{translate:2px 0}}
.card.enter{animation:pop .34s var(--ease)}
.card.flash{animation:flash .4s var(--ease)}
.shake{animation:shake .38s}
@media (prefers-reduced-motion:reduce){*:not(.runner,.runner *){animation-duration:.01ms!important}}
</style>
</head>

      <header class="zh"><span class="zl">Giao việc</span><span class="zc"></span></header>

    </section>
  </div>
</main>

<datalist id="people"></datalist>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="stag" id="eTag"></div>
  <textarea id="eTitle" rows="1" enterkeyhint="done" maxlength="160" spellcheck="false"></textarea>
  <div class="srow">
    <label class="field person"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20c.7-3.7 3.6-5.8 7.2-5.8s6.5 2.1 7.2 5.8"/></svg><input id="ePerson" type="text" list="people" placeholder="Người" enterkeyhint="done" maxlength="40" autocapitalize="words" spellcheck="false" autocomplete="off"></label>
    <div class="field time" id="eTimeF"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.6V12l2.8 1.9"/></svg><span class="tv">Thời gian</span><button type="button" class="clr" aria-label="Bỏ thời gian"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button><input type="datetime-local" aria-label="Thời gian"></div>
  </div>
  <div class="sact"><button type="button" class="btn lite" id="eCancel">Hủy</button><button type="button" class="btn solid" id="eSave">Lưu</button></div>
</div>

<div class="edge" id="edge"></div>

<script>
(()=>{
'use strict';
const Z=[1,3,4],MAX1=5,NAME={1:'Tự làm',3:'Giám sát',4:'Giao việc'};
const $=s=>document.querySelector(s);
const zones={},lists={},counts={};
Z.forEach(z=>{zones[z]=$('#z'+z);lists[z]=zones[z].querySelector('.list');counts[z]=zones[z].querySelector('.zc');});
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(_){}};
const clock=()=>performance.now();

/* ================= data ================= */
/* DB.tasks: mọi việc, kể cả việc đã xóa (z=0, "dấu xóa").
   Mỗi việc có 2 nhóm mốc thời gian độc lập để gộp không mất dữ liệu:
   - nội dung (title, person, time) -> mốc u
   - vị trí (z = vùng, o = thứ tự)   -> mốc pu
   S: dạng hiển thị, suy ra từ DB. */
const KEY='leantodo.v2',OLD_KEY='leantodo.v1',API='/api/data',TOMB_MS=30*864e5;
let DB={tasks:{},p:[]};
let S={1:[],3:[],4:[]};
const SYNC={etag:null,dirty:false};
const now=()=>Date.now();
const byO=(a,b)=>a.o-b.o||(a.id<b.id?-1:1);

function cleanTask(t){
  if(!t||typeof t.id!=='string'||!t.id||typeof t.title!=='string')return null;
  const num=(v,d)=>Number.isFinite(v)?v:d;
  return{id:t.id.slice(0,40),title:t.title.slice(0,160),
    person:typeof t.person==='string'?t.person.slice(0,40):'',
    time:typeof t.time==='string'?t.time.slice(0,32):'',
    u:num(t.u,1),z:[0,1,3,4].includes(t.z)?t.z:3,o:num(t.o,0),pu:num(t.pu,1)};
}
function cleanData(d){
  const tasks={};
  if(d&&d.tasks&&typeof d.tasks==='object')for(const k in d.tasks){const t=cleanTask(d.tasks[k]);if(t)tasks[t.id]=t;}
  const p=Array.isArray(d&&d.p)?[...new Set(d.p.filter(x=>typeof x==='string'&&x.trim()).map(x=>x.trim().slice(0,40)))].slice(0,40):[];
  return{tasks,p};
}
function rebuild(){Z.forEach(z=>{S[z]=Object.values(DB.tasks).filter(t=>t.z===z).sort(byO);});}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({v:2,tasks:DB.tasks,p:DB.p,etag:SYNC.etag,dirty:SYNC.dirty}));}catch(_){}}
let ver=0;
function save(){ver++;SYNC.dirty=true;persist();schedulePush();}

function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||'null');
    if(d&&d.tasks){
      const c=cleanData(d);DB.tasks=c.tasks;DB.p=c.p;
      SYNC.etag=typeof d.etag==='string'?d.etag:null;SYNC.dirty=!!d.dirty;
    }else{
      /* chuyển dữ liệu cũ (v1) lên định dạng mới; mốc 1 = rất cũ nên dữ liệu trên server luôn thắng khi trùng */
      const o=JSON.parse(localStorage.getItem(OLD_KEY)||'null');
      if(o&&o.z){
        Z.forEach(z=>(Array.isArray(o.z[z])?o.z[z]:[]).forEach((t,i)=>{
          if(t&&t.id&&t.title)DB.tasks[t.id]=cleanTask({id:String(t.id),title:t.title,person:t.person||'',time:t.time||'',u:1,z,o:i+1,pu:1});
        }));
        DB.p=Array.isArray(o.p)?o.p.filter(x=>typeof x==='string'&&x).slice(0,40):[];
        SYNC.dirty=Object.keys(DB.tasks).length>0;persist();
      }
    }
  }catch(_){}
  normalize();rebuild();
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function find(id){for(const z of Z){const i=S[z].findIndex(t=>t.id===id);if(i>-1)return{z,i,t:S[z][i]};}return null;}
function rememberPerson(n){n=(n||'').trim();if(!n)return;DB.p=[n,...DB.p.filter(x=>x.toLowerCase()!==n.toLowerCase())].slice(0,40);renderPeople();}
function renderPeople(){$('#people').replaceChildren(...DB.p.map(n=>{const o=document.createElement('option');o.value=n;return o;}));}

/* ---------- gộp dữ liệu ---------- */
const pickC=(x,y)=>x.u!==y.u?(x.u>y.u?x:y):(JSON.stringify([x.title,x.person,x.time])>=JSON.stringify([y.title,y.person,y.time])?x:y);
const pickP=(x,y)=>x.pu!==y.pu?(x.pu>y.pu?x:y):(x.z!==y.z?(x.z>y.z?x:y):(x.o>=y.o?x:y));
function mergeTask(x,y){const c=pickC(x,y),p=pickP(x,y);return{id:x.id,title:c.title,person:c.person,time:c.time,u:c.u,z:p.z,o:p.o,pu:p.pu};}
const canon=(tasks,p)=>JSON.stringify([Object.keys(tasks).sort().map(k=>{const t=tasks[k];return[t.id,t.title,t.person,t.time,t.u,t.z,t.o,t.pu];}),[...p].sort()]);
/* quy tắc tối đa MAX1 việc ở "Tự làm": phần dư (xếp sau) chuyển sang "Giám sát", cách làm xác định nên mọi máy ra cùng kết quả */
function normalize(){
  const l1=Object.values(DB.tasks).filter(t=>t.z===1).sort(byO);
  if(l1.length<=MAX1)return;
  let tail=Object.values(DB.tasks).filter(t=>t.z===3).reduce((m,t)=>Math.max(m,t.o),0);
  l1.slice(MAX1).forEach(t=>{t.z=3;t.pu+=1;t.o=++tail;});
}
function compact(){const lim=now()-TOMB_MS;for(const id in DB.tasks){const t=DB.tasks[id];if(t.z===0&&t.pu<lim)delete DB.tasks[id];}}
/* gộp bản từ server vào bản trên máy (sửa tại chỗ để giữ nguyên tham chiếu). Trả true nếu máy này có thứ server chưa có */
function mergeRemote(rd){
  const r=cleanData(rd);
  for(const id in r.tasks){const x=DB.tasks[id];DB.tasks[id]=x?Object.assign(x,mergeTask(x,r.tasks[id])):r.tasks[id];}
  const mine=DB.p;
  DB.p=[...mine,...r.p.filter(n=>!mine.some(m=>m.toLowerCase()===n.toLowerCase()))].slice(0,40);
  normalize();compact();
  return canon(DB.tasks,DB.p)!==canon(r.tasks,r.p);
}

/* ---------- vị trí: chỉ gán lại những việc thực sự bị dời ---------- */
function place(items,z,stamp){
  const n=items.length;if(!n)return;
  const len=new Array(n).fill(0),prev=new Array(n).fill(-1);let best=-1;
  for(let i=0;i<n;i++){
    if(items[i].z!==z)continue;
    len[i]=1;
    for(let j=0;j<i;j++)if(items[j].z===z&&items[j].o<items[i].o&&len[j]+1>len[i]){len[i]=len[j]+1;prev[i]=j;}
    if(best<0||len[i]>len[best])best=i;
  }
  const keep=new Set();for(let k=best;k>=0;k=prev[k])keep.add(k);
  const touched=[];
  let i=0;
  while(i<n){
    if(keep.has(i)){i++;continue;}
    let j=i;while(j<n&&!keep.has(j))j++;
    const m=j-i,lo=i>0?items[i-1].o:null,hi=j<n?items[j].o:null;
    let a,step=1;
    if(lo===null&&hi===null)a=0;
    else if(hi===null)a=lo;
    else if(lo===null)a=hi-m-1;
    else{step=(hi-lo)/(m+1);a=lo;}
    for(let k=0;k<m;k++){const t=items[i+k];t.o=a+step*(k+1);touched.push(t);}
    i=j;
  }
  touched.forEach(t=>{t.z=z;t.pu=stamp;});
  let tight=false;for(let k=1;k<n;k++)if(!(items[k].o-items[k-1].o>1e-9))tight=true;
  if(tight)items.forEach((t,k)=>{t.z=z;t.o=k+1;t.pu=stamp;});
}
const lastO=z=>S[z].length?S[z][S[z].length-1].o:0;

/* ================= sync ================= */
let busy=false,again=false,wantPull=false,pushTimer=0,retryTimer=0,fails=0,lastPull=0;
const view=()=>JSON.stringify(Z.map(z=>S[z].map(t=>[t.id,t.title,t.person,t.time])));
/* chỉ gộp dữ liệu từ máy chủ khi người dùng không đang kéo thả / mở form sửa */
const idle=()=>!D.drag&&!D.pending&&!E.id;
const whenIdle=()=>new Promise(res=>{const t=()=>idle()?res():setTimeout(t,250);t();});
function paintRemote(before){
  rebuild();persist();
  if(view()===before)return;
  const sc=Z.map(z=>lists[z].scrollTop);
  renderAll();renderPeople();
  Z.forEach((z,i)=>{lists[z].scrollTop=sc[i];});
}
async function call(method,body,keepalive){
  let url=API;if(method==='GET'&&SYNC.etag)url+='?etag='+encodeURIComponent(SYNC.etag);
  const res=await fetch(url,{method,cache:'no-store',keepalive:!!keepalive,
    headers:body?{'Content-Type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined});
  let j=null;try{j=await res.json();}catch(_){}
  return{status:res.status,j:j||{}};
}
async function syncOnce(pull,keepalive){
  if(pull){
    lastPull=now();
    const r=await call('GET');
    if(r.status!==200)throw new Error('GET '+r.status);
    if(!r.j.notModified){
      await whenIdle();
      const before=view();
      if(r.j.data){if(mergeRemote(r.j.data))SYNC.dirty=true;SYNC.etag=r.j.etag||null;}
      else{SYNC.etag=null;if(Object.keys(DB.tasks).length)SYNC.dirty=true;}   /* server trống: đẩy dữ liệu trên máy lên */
      paintRemote(before);
    }
  }
  for(let n=0;SYNC.dirty;n++){
    if(n>=5)throw new Error('conflict');
    const snap=ver;
    const r=await call('PUT',{data:{v:2,tasks:DB.tasks,p:DB.p},etag:SYNC.etag},keepalive);
    if(r.status===200){
      SYNC.etag=r.j.etag||null;
      if(ver===snap)SYNC.dirty=false;else again=true;   /* có thay đổi mới trong lúc đang ghi */
      persist();break;
    }
    if(r.status===409){                                  /* máy khác vừa ghi: gộp rồi ghi lại */
      await whenIdle();
      const before=view();
      if(r.j.data){mergeRemote(r.j.data);SYNC.etag=r.j.etag||null;}else SYNC.etag=null;
      SYNC.dirty=true;paintRemote(before);continue;
    }
    throw new Error('PUT '+r.status);
  }
}
async function runSync(pull,keepalive){
  if(pull)wantPull=true;
  if(busy){again=true;return;}
  busy=true;clearTimeout(retryTimer);
  let p=false;
  try{
    do{again=false;p=wantPull;wantPull=false;await syncOnce(p,keepalive);}while(again);
    fails=0;
  }catch(e){
    if(p)wantPull=true;
    fails++;retryTimer=setTimeout(()=>runSync(false),Math.min(120000,4000*Math.pow(2,fails)));
  }finally{busy=false;}
}
/* gộp các thay đổi liên tiếp thành một lần ghi */
function schedulePush(){clearTimeout(pushTimer);pushTimer=setTimeout(()=>runSync(false),1500);}
function flushNow(){if(SYNC.dirty){clearTimeout(pushTimer);runSync(false,true);}}
function startSync(){
  runSync(true);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)flushNow();
    else if(now()-lastPull>15000)runSync(true);
  });
  addEventListener('pagehide',flushNow);
  addEventListener('pageshow',e=>{if(e.persisted)runSync(true);});
  addEventListener('online',()=>runSync(true));
}

/* ================= time ================= */
const pad=n=>String(n).padStart(2,'0');
const WD=['CN','T2','T3','T4','T5','T6','T7'];
const parse=v=>{if(!v)return null;const d=new Date(v);return isNaN(d)?null:d;};
function dayDiff(d){const n=new Date();return Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5);}
function fmtCard(v){const d=parse(v);if(!d)return'';const hm=pad(d.getHours())+':'+pad(d.getMinutes()),k=dayDiff(d);if(k===0)return hm;if(k===1)return'Mai '+hm;return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+hm;}
function fmtChip(v){const d=parse(v);if(!d)return'';const hm=pad(d.getHours())+':'+pad(d.getMinutes()),k=dayDiff(d);if(k===0)return hm+' · Hôm nay';if(k===1)return hm+' · Mai';if(k===-1)return hm+' · Hôm qua';return hm+' · '+WD[d.getDay()]+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1);}
const isLate=v=>{const d=parse(v);return !!d&&d<new Date();};

/* ================= colour ================= */
const T={dark:false},ACC={};let FADE=[255,255,255];
const hex=h=>{h=String(h).trim().replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');const n=parseInt(h,16)||0;return[n>>16&255,n>>8&255,n&255];};
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const rgb=c=>'rgb('+c[0]+','+c[1]+','+c[2]+')';
const lum=c=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);};return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2]);};
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
const mq=matchMedia('(prefers-color-scheme: dark)');
function readTheme(){const cs=getComputedStyle(document.documentElement);T.dark=mq.matches;Z.forEach(z=>{ACC[z]=hex(cs.getPropertyValue('--z'+z));});FADE=hex(cs.getPropertyValue('--fade'));}
function shade(z,i,n){
  const tmax=T.dark?.7:.8;
  const step=n>1?Math.min(tmax/4,tmax/(n-1)):0;
  const t=Math.min(i*step,tmax);
  const a=ACC[z],bg=mix(a,FADE,t);
  const lightTxt=T.dark?[236,238,244]:[255,255,255],darkTxt=mix(a,[8,10,20],.6);
  const bias=T.dark?1.6:1;
  return{a,bg,fg:contrast(bg,lightTxt)*bias>=contrast(bg,darkTxt)?lightTxt:darkTxt,k:1-t/tmax};
}
function paint(el,z,i,n){
  const s=shade(z,i,n),st=el.style,a=s.a.join(',');
  st.setProperty('--bg',rgb(s.bg));
  st.setProperty('--fg',rgb(s.fg));
  st.setProperty('--sh',T.dark
    ?'inset 0 1px 0 rgba(255,255,255,'+(.04+.08*s.k).toFixed(3)+'),0 1px 2px rgba(0,0,0,.45),0 8px 18px -10px rgba(0,0,0,.9)'
    :'inset 0 1px 0 rgba(255,255,255,'+(.1+.14*s.k).toFixed(3)+'),inset 0 0 0 1px rgba('+a+','+(.1-.06*s.k).toFixed(3)+'),0 1px 2px rgba('+a+',.12),0 6px 14px -8px rgba('+a+','+(.16+.42*s.k).toFixed(3)+')');
  st.setProperty('--phc','rgba('+a+',.42)');
}

/* ================= cards ================= */
const IC={
  p:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20c.7-3.7 3.6-5.8 7.2-5.8s6.5 2.1 7.2 5.8"/></svg>',
  t:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.6V12l2.8 1.9"/></svg>',
  j:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="M8.6 12.2l2.3 2.3 4.5-4.7"/></svg>'
};
function chip(cls,icon,text){const s=document.createElement('span');s.className=cls;s.innerHTML=icon;const i=document.createElement('i');i.textContent=text;s.append(i);return s;}
const swapped=(t,z)=>z===4&&!!t.person;
function meta(cm,t,sw){
  cm.replaceChildren();
  if(sw)cm.append(chip('cj',IC.j,t.title));
  else if(t.person)cm.append(chip('cp',IC.p,t.person));
  if(t.time){const x=fmtCard(t.time);if(x)cm.append(chip('cd'+(isLate(t.time)?' late':''),IC.t,x));}
}
function fill(el,t,z){
  const sw=swapped(t,z);
  let ct=el.querySelector(':scope>.ct'),cm=el.querySelector(':scope>.cm');
  if(!ct||!cm){ct=document.createElement('div');ct.className='ct';cm=document.createElement('div');cm.className='cm';el.replaceChildren(ct,cm);}
  const txt=sw?t.person:t.title;if(ct.textContent!==txt)ct.textContent=txt;
  meta(cm,t,sw);el.dataset.mode=sw?'p':'t';
}
function syncMode(el,z){const f=find(el.dataset.id);if(f&&el.dataset.mode!==(swapped(f.t,z)?'p':'t'))fill(el,f.t,z);}
function cardEl(t,z){const el=document.createElement('div');el.className='card';el.dataset.id=t.id;fill(el,t,z);return el;}
function enter(el){el.classList.add('enter');el.addEventListener('animationend',()=>el.classList.remove('enter'),{once:true});}

function fade(l){
  const top=l.scrollTop>2,bot=l.scrollTop+l.clientHeight<l.scrollHeight-2;
  l.classList.toggle('ft',top);l.classList.toggle('fb',bot);
}
function recolor(z){
  const kids=[...lists[z].children],n=kids.length;
  kids.forEach((el,i)=>{paint(el,z,i,n);el.classList.toggle('row',z===1);syncMode(el,z);});
  const c=counts[z];
  if(z===1){c.textContent=n+'/'+MAX1;c.classList.toggle('full',n>=MAX1);}else c.textContent=n?String(n):'';
  fade(lists[z]);
}
function renderAll(){Z.forEach(z=>{lists[z].replaceChildren(...S[z].map(t=>cardEl(t,z)));recolor(z);});}
function commit(){
  const t0=now(),seen=new Set();
  Z.forEach(z=>{
    const items=[...lists[z].children].map(c=>DB.tasks[c.dataset.id]).filter(Boolean);
    place(items,z,t0);items.forEach(t=>seen.add(t.id));
  });
  for(const id in DB.tasks){const t=DB.tasks[id];if(t.z!==0&&!seen.has(id)){t.z=0;t.pu=t0;}}   /* bị xóa -> dấu xóa */
  rebuild();Z.forEach(recolor);
  save();
}
/* FLIP: animate siblings to their new slots */
function flip(ls,mutate,skip){
  const first=[];
  ls.forEach(l=>{for(const c of l.children)if(c!==skip)first.push([c,c.getBoundingClientRect(),l]);});
  mutate();
  const keep=first.filter(([c,,l])=>c.isConnected&&c.parentElement===l);
  keep.forEach(([c])=>{c.style.transition='none';c.style.transform='';});
  const last=keep.map(([c])=>c.getBoundingClientRect());
  keep.forEach(([c,f],i)=>{const dx=f.left-last[i].left,dy=f.top-last[i].top;if(Math.abs(dx)>.5||Math.abs(dy)>.5)c.style.transform='translate('+dx+'px,'+dy+'px)';});
  void document.body.offsetHeight;
  keep.forEach(([c])=>{
    if(c.style.transform){c.style.transition='transform .24s var(--ease),background-color .3s,color .3s,box-shadow .3s';c.style.transform='';}
    else c.style.transition='';
  });
}
function shakeEl(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}

/* ================= time field ================= */
function bindTime(f){
  const inp=f.querySelector('input'),tv=f.querySelector('.tv'),clr=f.querySelector('.clr');
  const upd=()=>{const v=inp.value;tv.textContent=v?fmtChip(v):'Thời gian';f.classList.toggle('has',!!v);f.classList.toggle('late',isLate(v));};
  inp.addEventListener('input',upd);inp.addEventListener('change',upd);
  inp.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&inp.showPicker){try{inp.showPicker();e.preventDefault();}catch(_){}}});
  clr.addEventListener('pointerdown',e=>e.preventDefault());
  clr.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();inp.value='';upd();});
  return{get:()=>inp.value,set:v=>{inp.value=v||'';upd();},refresh:upd};
}

/* ================= composer ================= */
const form=$('#composer'),fTitle=$('#fTitle'),fPerson=$('#fPerson'),addBtn=$('#add'),fTime=bindTime($('#fTimeF'));
const syncAdd=()=>addBtn.classList.toggle('off',!fTitle.value.trim());
fTitle.addEventListener('input',syncAdd);
['pointerdown','mousedown'].forEach(ev=>addBtn.addEventListener(ev,e=>e.preventDefault()));
form.addEventListener('submit',e=>{e.preventDefault();addTask();});
function addTask(){
  const title=fTitle.value.trim().replace(/\s+/g,' ');
  if(!title){shakeEl(fTitle);fTitle.focus();return;}
  const person=fPerson.value.trim().replace(/\s+/g,' '),time=fTime.get();
  let z=1;
  if(S[1].length>=MAX1){z=3;shakeEl(counts[1]);}
  const ts=now(),t={id:uid(),title,person,time,u:ts,z,o:lastO(z)+1,pu:ts};
  DB.tasks[t.id]=t;S[z].push(t);rememberPerson(person);
  const el=cardEl(t,z);enter(el);lists[z].append(el);recolor(z);save();
  requestAnimationFrame(()=>lists[z].scrollTo({top:lists[z].scrollHeight,behavior:'smooth'}));
  fTitle.value='';fPerson.value='';fTime.set('');syncAdd();
  fTitle.focus({preventScroll:true});
}

/* ================= edit sheet ================= */
const sheet=$('#sheet'),scrim=$('#scrim'),eTitle=$('#eTitle'),ePerson=$('#ePerson'),eTag=$('#eTag'),eTime=bindTime($('#eTimeF'));
const E={id:null,at:0,pushed:false};
function grow(){eTitle.style.height='auto';eTitle.style.height=Math.min(eTitle.scrollHeight,170)+'px';}
eTitle.addEventListener('input',grow);
function openEdit(id){
  const f=find(id);if(!f)return;
  E.id=id;E.at=clock();
  eTitle.value=f.t.title;ePerson.value=f.t.person||'';eTime.set(f.t.time||'');
  sheet.style.setProperty('--acc',rgb(ACC[f.z]));eTag.textContent=NAME[f.z];
  scrim.classList.add('on');sheet.classList.add('on');grow();
  eTitle.focus({preventScroll:true});
  const n=eTitle.value.length;try{eTitle.setSelectionRange(n,n);}catch(_){}
  try{history.pushState({lean:1},'');E.pushed=true;}catch(_){E.pushed=false;}
}
function closeEdit(ok,fromPop){
  if(!E.id)return;
  const id=E.id;E.id=null;
  if(ok){
    const f=find(id);
    if(f){
      const title=eTitle.value.trim().replace(/\s+/g,' ')||f.t.title;
      const person=ePerson.value.trim().replace(/\s+/g,' '),time=eTime.get();
      const changed=title!==f.t.title||person!==f.t.person||time!==(f.t.time||'');
      if(changed){f.t.title=title;f.t.person=person;f.t.time=time;f.t.u=now();}
      rememberPerson(person);
      const el=lists[f.z].querySelector('[data-id="'+id+'"]');
      if(el){fill(el,f.t,f.z);el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}
      if(changed)save();else persist();
    }
  }
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  sheet.classList.remove('on');scrim.classList.remove('on');
  if(E.pushed&&!fromPop){E.pushed=false;try{history.back();}catch(_){}}else E.pushed=false;
}
eTitle.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();closeEdit(true);}});
ePerson.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();closeEdit(true);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&E.id)closeEdit(false);});
scrim.addEventListener('click',()=>{if(clock()-E.at>350)closeEdit(false);});
$('#eCancel').addEventListener('click',()=>closeEdit(false));
$('#eSave').addEventListener('click',()=>closeEdit(true));
addEventListener('popstate',()=>{if(E.id)closeEdit(false,true);});

/* ================= undo ================= */
const snack=$('#snack'),snackTxt=$('#snackTxt');let U=null,uTimer=0;
function showUndo(task,z,i){
  U={task,z,i};snackTxt.textContent='Đã xóa “'+task.title+'”';
  snack.classList.add('on');clearTimeout(uTimer);uTimer=setTimeout(hideUndo,5000);
}
function hideUndo(){snack.classList.remove('on');U=null;}
$('#undo').addEventListener('click',()=>{
  if(!U)return;
  let{task,z,i}=U;hideUndo();
  const t=DB.tasks[task.id]||(DB.tasks[task.id]=task);
  if(t.z!==0)return;
  if(z===1&&S[1].length>=MAX1)z=3;
  i=Math.min(i,S[z].length);
  const list=lists[z],el=cardEl(t,z);
  flip([list],()=>list.insertBefore(el,list.children[i]||null));
  enter(el);commit();
});

/* ================= drag engine ================= */
const D={pending:null,drag:null,lastTap:null};
const edgeEl=$('#edge');
const zoneOf=el=>+el.closest('.zone').dataset.zone;
const scrollable=l=>l.scrollHeight>l.clientHeight+1;
function pickCard(target){
  const c=target&&target.closest&&target.closest('.card');
  if(!c||c.classList.contains('ph')||c.classList.contains('ghost')||!c.parentElement||!c.parentElement.classList.contains('list'))return null;
  return c;
}
function cancelPending(){const p=D.pending;if(!p)return;clearTimeout(p.timer);clearTimeout(p.pt);p.card.classList.remove('press');D.pending=null;}
function tap(card,x,y,ev){
  const t=clock(),L=D.lastTap;
  if(L&&L.card===card&&t-L.t<340&&Math.hypot(x-L.x,y-L.y)<30){
    D.lastTap=null;if(ev&&ev.cancelable)ev.preventDefault();openEdit(card.dataset.id);return;
  }
  D.lastTap={card,t,x,y};
}

/* --- touch ---
   Listeners sit on the touched element AND on document: the touched element keeps
   receiving its own touch events whatever happens to the DOM around it, and the
   _lt flag guarantees each event is handled exactly once. Touches are tracked by id. */
const TOPT={passive:false};
const findTouch=(list,id)=>{for(const t of list)if(t.identifier===id)return t;return null;};
function bindTouch(tg){unbindTouch();D.tg=tg;tg.addEventListener('touchmove',onTMove,TOPT);tg.addEventListener('touchend',onTEnd,TOPT);tg.addEventListener('touchcancel',onTCancel,TOPT);}
function unbindTouch(){const tg=D.tg;if(!tg)return;D.tg=null;tg.removeEventListener('touchmove',onTMove,TOPT);tg.removeEventListener('touchend',onTEnd,TOPT);tg.removeEventListener('touchcancel',onTCancel,TOPT);}
document.addEventListener('touchstart',e=>{
  /* self-heal: a drag/press whose finger is already gone is closed before anything else */
  if(D.drag&&D.drag.type==='touch'&&!findTouch(e.touches,D.drag.tid))endDrag(true);
  if(D.pending&&D.pending.type==='touch'&&!findTouch(e.touches,D.pending.tid))cancelPending();
  if(E.id||D.drag)return;
  if(e.touches.length>1){cancelPending();return;}
  const c=pickCard(e.target);if(!c)return;
  const t=e.changedTouches[0],list=c.parentElement;
  bindTouch(e.target);
  const p=D.pending={card:c,list,tid:t.identifier,x:t.clientX,y:t.clientY,lx:t.clientX,ly:t.clientY,t:clock(),type:'touch',sc:scrollable(list)};
  if(p.sc){
    p.pt=setTimeout(()=>{if(D.pending===p)c.classList.add('press');},90);
    p.timer=setTimeout(()=>{if(D.pending===p)startDrag(p.lx,p.ly);},200);
  }
},{passive:true});
function onTMove(e){
  if(e._lt)return;e._lt=1;
  const cur=D.drag||D.pending;if(!cur||cur.type!=='touch')return;
  const t=findTouch(e.touches,cur.tid);if(!t)return;
  if(D.drag){if(e.cancelable)e.preventDefault();moveDrag(t.clientX,t.clientY);return;}
  const p=D.pending;
  p.lx=t.clientX;p.ly=t.clientY;
  const dx=p.lx-p.x,dy=p.ly-p.y,ad=Math.abs(dx),dist=Math.hypot(dx,dy);
  if(!p.sc){
    if(e.cancelable){e.preventDefault();if(dist>6)startDrag(p.lx,p.ly);}else cancelPending();
    return;
  }
  if(ad>8&&ad>Math.abs(dy)*1.2){if(e.cancelable){e.preventDefault();startDrag(p.lx,p.ly);}else cancelPending();return;}
  if(dist>10)cancelPending();
}
function onTEnd(e){
  if(e._lt)return;e._lt=1;
  if(!e.touches.length)unbindTouch();
  const d=D.drag;
  if(d){if(d.type==='touch'&&findTouch(e.changedTouches,d.tid))endDrag(false);return;}
  const p=D.pending;if(!p||p.type!=='touch'||!findTouch(e.changedTouches,p.tid))return;
  cancelPending();
  if(clock()-p.t<400&&Math.hypot(p.lx-p.x,p.ly-p.y)<10)tap(p.card,p.x,p.y,e);
}
function onTCancel(e){
  if(e._lt)return;e._lt=1;
  if(!e.touches.length)unbindTouch();
  if(D.drag&&D.drag.type==='touch')endDrag(true);else if(D.pending&&D.pending.type==='touch')cancelPending();
}
document.addEventListener('touchmove',onTMove,TOPT);
document.addEventListener('touchend',onTEnd,TOPT);
document.addEventListener('touchcancel',onTCancel,TOPT);

/* --- mouse / pen --- */
document.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'||e.button!==0||E.id||D.drag)return;
  const c=pickCard(e.target);if(!c)return;
  e.preventDefault();
  D.pending={card:c,list:c.parentElement,x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,t:clock(),type:'mouse'};
});
addEventListener('pointermove',e=>{
  if(e.pointerType==='touch')return;
  if(D.drag){if(D.drag.type==='mouse')moveDrag(e.clientX,e.clientY);return;}
  const p=D.pending;if(!p||p.type!=='mouse')return;
  p.lx=e.clientX;p.ly=e.clientY;
  if(Math.hypot(p.lx-p.x,p.ly-p.y)>4)startDrag(p.lx,p.ly);
});
addEventListener('pointercancel',e=>{
  if(e.pointerType==='touch')return;
  if(D.drag&&D.drag.type==='mouse')endDrag(true);else cancelPending();
});
addEventListener('pointerup',e=>{
  if(e.pointerType==='touch')return;
  if(D.drag){if(D.drag.type==='mouse')endDrag(false);return;}
  const p=D.pending;if(!p||p.type!=='mouse')return;
  cancelPending();tap(p.card,p.x,p.y,null);
});

/* --- drag lifecycle --- */
function startDrag(x,y){
  const p=D.pending;if(!p)return;
  cancelPending();
  const card=p.card;if(!card.isConnected)return;
  D.lastTap=null;
  const r=card.getBoundingClientRect(),list=card.parentElement,z=zoneOf(list);
  const g=card.cloneNode(true);
  g.classList.remove('enter','flash','press');g.classList.add('ghost');
  g.style.transition='none';
  g.style.transform='translate3d('+r.left+'px,'+r.top+'px,0)';
  g.style.width=r.width+'px';
  document.body.append(g);
  g.getBoundingClientRect();g.style.transition='';
  card.style.transform='';card.style.transition='';
  card.classList.add('ph');
  const d=D.drag={type:p.type,tid:p.tid,card,g,from:z,zone:z,hover:z,x,y,ox:x-r.left,oy:y-r.top,w:r.width,h:r.height,
    s:1,rot:0,armed:false,denied:false,smp:[{x,y,t:clock()}],raf:0};
  document.body.classList.add('dragging');
  vib(8);
  recolor(z);paintGhost();setHover(z);
  d.raf=requestAnimationFrame(frame);
}
function frame(){
  const d=D.drag;if(!d)return;
  const v=vel(d);
  const rt=d.armed?0:Math.max(-7,Math.min(7,v.x*9));
  d.rot+=(rt-d.rot)*.2;
  d.s+=((d.armed?.9:1.04)-d.s)*.25;
  d.g.style.transform='translate3d('+(d.x-d.ox)+'px,'+(d.y-d.oy)+'px,0) rotate('+d.rot.toFixed(2)+'deg) scale('+d.s.toFixed(3)+')';
  autoScroll(d);
  d.raf=requestAnimationFrame(frame);
}
function moveDrag(x,y){
  const d=D.drag;if(!d)return;
  d.x=x;d.y=y;
  const t=clock();d.smp.push({x,y,t});
  while(d.smp.length>2&&t-d.smp[0].t>160)d.smp.shift();
  target();
}
function vel(d){
  const s=d.smp,n=s.length;if(n<2)return{x:0,y:0};
  const last=s[n-1];if(clock()-last.t>90)return{x:0,y:0};
  let f=s[0];for(let i=n-1;i>=0;i--){if(last.t-s[i].t>=60){f=s[i];break;}}
  const dt=last.t-f.t;if(dt<10)return{x:0,y:0};
  return{x:(last.x-f.x)/dt,y:(last.y-f.y)/dt};
}
function setHover(z){if(D.drag)D.drag.hover=z;Z.forEach(k=>zones[k].classList.toggle('over',k===z));}
function deny(on){
  const d=D.drag;zones[1].classList.toggle('deny',on);
  if(on&&d&&!d.denied){shakeEl(counts[1]);vib([5,30,5]);}
  if(d)d.denied=on;
}
function paintGhost(){const d=D.drag,list=d.card.parentElement,kids=[...list.children];paint(d.g,zoneOf(list),kids.indexOf(d.card),kids.length);}
function morph(){
  const d=D.drag,f=find(d.card.dataset.id);
  if(f)fill(d.g,f.t,d.zone);
  const w=d.card.offsetWidth;
  d.g.classList.toggle('row',d.zone===1);
  if(w&&Math.abs(w-d.w)>=1){d.ox*=w/d.w;d.w=w;d.g.style.width=w+'px';}
}
function target(){
  const d=D.drag;if(!d)return;
  const W=innerWidth,H=innerHeight,gx=d.x-d.ox,gy=d.y-d.oy,w=d.w,h=d.card.offsetHeight||d.h;
  const vw=Math.max(0,Math.min(gx+w,W)-Math.max(gx,0)),vh=Math.max(0,Math.min(gy+h,H)-Math.max(gy,0));
  const out=1-(vw*vh)/(w*h),edge=Math.min(d.x,W-d.x,d.y,H-d.y),armed=d.armed?(out>=.42||edge<=22):(out>=.5||edge<=10);
  if(armed!==d.armed){d.armed=armed;d.g.classList.toggle('doomed',armed);edgeEl.classList.toggle('on',armed);if(armed)vib(6);}
  if(armed){setHover(null);deny(false);return;}
  let z=null;
  for(const k of Z){const r=zones[k].getBoundingClientRect();if(d.x>=r.left&&d.x<=r.right&&d.y>=r.top&&d.y<=r.bottom){z=k;break;}}
  if(z===null){setHover(null);deny(false);return;}
  if(z===1&&d.zone!==1&&lists[1].querySelectorAll('.card:not(.ph)').length>=MAX1){setHover(null);deny(true);return;}
  deny(false);setHover(z);
  const list=lists[z],kids=[...list.children].filter(c=>c!==d.card);
  const lr=list.getBoundingClientRect(),cy=gy+h/2-lr.top+list.scrollTop;
  let before=null;
  for(const c of kids){if(cy<c.offsetTop+c.offsetHeight/2){before=c;break;}}
  const cur=d.card.parentElement===list?d.card.nextElementSibling:undefined;
  if(cur===before)return;
  const from=d.card.parentElement;
  flip(from===list?[list]:[from,list],()=>list.insertBefore(d.card,before),d.card);
  if(from!==list){const fz=zoneOf(from);d.zone=z;recolor(fz);recolor(z);morph();}
  else recolor(z);
  paintGhost();
}
function autoScroll(d){
  if(d.armed||!d.hover)return;
  const l=lists[d.hover];if(!scrollable(l))return;
  const r=l.getBoundingClientRect(),band=48;let v=0;
  if(d.y<r.top+band)v=-Math.min(1,(r.top+band-d.y)/band)*14;
  else if(d.y>r.bottom-band)v=Math.min(1,(d.y-(r.bottom-band))/band)*14;
  if(!v)return;
  const b=l.scrollTop;l.scrollTop+=v;
  if(l.scrollTop!==b)target();
}
function endDrag(cancel){
  const d=D.drag;if(!d)return;
  D.drag=null;cancelAnimationFrame(d.raf);
  document.body.classList.remove('dragging');
  Z.forEach(k=>zones[k].classList.remove('over'));zones[1].classList.remove('deny');edgeEl.classList.remove('on');
  const v=vel(d),W=innerWidth,H=innerHeight;
  const cx=d.x-d.ox+d.w/2,cy=d.y-d.oy+(d.card.offsetHeight||d.h)/2;
  const sp=Math.hypot(v.x,v.y),px=cx+v.x*240,py=cy+v.y*240;
  const flung=sp>1.9&&(px<-30||px>W+30||py<-30||py>H+30);
  if(!cancel&&(d.armed||flung))discard(d,v,cx,cy);else settle(d);
}
function settle(d){
  const g=d.g,c=d.card,r=c.getBoundingClientRect();
  g.classList.remove('doomed');g.classList.add('settle');
  g.classList.toggle('row',zoneOf(c)===1);
  g.style.transition='transform .26s var(--ease),width .26s var(--ease),background-color .25s,color .25s';
  g.style.width=r.width+'px';
  g.style.transform='translate3d('+r.left+'px,'+r.top+'px,0) rotate(0deg) scale(1)';
  let done=false;
  const fin=()=>{if(done)return;done=true;g.remove();c.classList.remove('ph');commit();};
  g.addEventListener('transitionend',e=>{if(e.propertyName==='transform')fin();});
  setTimeout(fin,330);
}
function discard(d,v,cx,cy){
  const g=d.g,W=innerWidth,H=innerHeight;
  let dx=v.x,dy=v.y;
  if(Math.hypot(dx,dy)<.4){dx=cx-W/2;dy=cy-H/2;}
  const n=Math.hypot(dx,dy)||1,dist=Math.max(W,H)*.9;
  const tx=d.x-d.ox+dx/n*dist,ty=d.y-d.oy+dy/n*dist,rot=(dx>=0?1:-1)*(18+Math.random()*10);
  g.classList.add('doomed');
  g.style.transition='transform .42s cubic-bezier(.3,.5,.4,1),opacity .42s ease-in';
  g.style.transform='translate3d('+tx+'px,'+ty+'px,0) rotate('+rot+'deg) scale(.82)';
  g.style.opacity='0';
  setTimeout(()=>g.remove(),460);
  const orig=find(d.card.dataset.id);
  const list=d.card.parentElement;
  flip([list],()=>d.card.remove());
  commit();
  if(orig)showUndo(orig.t,orig.z,orig.i);
  vib(14);
}

/* ================= misc ================= */
Z.forEach(z=>lists[z].addEventListener('scroll',()=>{
  fade(lists[z]);
  if(D.pending&&D.pending.list===lists[z]&&D.pending.type==='touch')cancelPending();
},{passive:true}));
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.card'))e.preventDefault();});
document.addEventListener('dragstart',e=>{if(e.target.closest&&e.target.closest('.card'))e.preventDefault();});

function refreshMeta(){
  Z.forEach(z=>{for(const c of lists[z].children){if(c.classList.contains('ph'))continue;const t=S[z].find(x=>x.id===c.dataset.id);if(t)fill(c,t,z);}});
  fTime.refresh();
}
setInterval(()=>{if(!D.drag)refreshMeta();},60000);
addEventListener('blur',()=>{if(D.drag)endDrag(true);cancelPending();});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(D.drag)endDrag(true);cancelPending();}
  else refreshMeta();
});

/* zone 1 always fits exactly 5 rows */
function fitRows(){
  const h=lists[1].clientHeight;
  const rh=Math.max(38,Math.min(52,Math.floor((h-10-4*6)/5)));
  document.documentElement.style.setProperty('--rh',rh+'px');
  Z.forEach(z=>fade(lists[z]));
}
if('ResizeObserver' in window){const ro=new ResizeObserver(fitRows);Z.forEach(z=>ro.observe(lists[z]));}
addEventListener('resize',fitRows);

const onTheme=()=>{readTheme();Z.forEach(recolor);};
if(mq.addEventListener)mq.addEventListener('change',onTheme);else if(mq.addListener)mq.addListener(onTheme);

/* ================= init ================= */
readTheme();load();renderPeople();renderAll();syncAdd();fitRows();startSync();
})();
